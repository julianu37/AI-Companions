[config]
schemaVersion = "0.0.1"

# Publicação no Thunderstore (comunidade Valheim).
# Uso:  tcli publish --file <zip do pacote> --config-path thunderstore.toml
# O token NÃO fica aqui: use a variável de ambiente TCLI_AUTH_TOKEN (ou --token).
# O pacote é montado à parte (ver AGENTS.md / docs/release-notes-1.6.0.md): a raiz do zip tem
# manifest.json + README.md + CHANGELOG.md + icon.png e o mod vai em BepInEx/plugins/ModAI-BR-Companions/.

[package]
namespace = "OpenCode"
name = "ModAI_BR_Companions"
versionNumber = "1.6.0"
description = "Companheiro NPC com IA para Valheim 1.0, em portugues do Brasil: fale ou digite e ele obedece (LLM e voz locais). Fork PT-BR do Offline Companions Reborn (MIT) - creditos ao ProfMags e ao Maddhattr."
websiteUrl = "https://github.com/julianu37/ModAI-BR-Companions"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./package/icon.png"
readme = "./package/README.md"
outdir = "./build"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim", ]
